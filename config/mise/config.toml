# Global mise config, linked to ~/.config/mise/config.toml by install.sh.
# Projects pin their own versions in .ruby-version, .node-version, .nvmrc or mise.toml.

[tools]
ruby = "4.0.9"
node = "26.12.1"

[settings]
# Read .ruby-version, .node-version and .nvmrc (off by default since mise 2025.10)
idiomatic_version_file_enable_tools = ["ruby", "node"]
